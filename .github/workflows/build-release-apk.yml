name: Build & Release Android APK — ChargePilot AI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag phiên bản phát hành (VD: v1.1.0)"
        required: true
        default: "v1.1.0"
      api_base_url:
        description: "URL HTTPS Backend VPS mặc định nhúng vào APK"
        required: true
        default: "https://maintaining-podcast-down-coding.trycloudflare.com"
      build_type:
        description: "Loại APK (release = bản phát hành, debug = Dev Client cho Metro Hot Reload)"
        type: choice
        required: true
        default: "release"
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Publish ChargePilot-AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://maintaining-podcast-down-coding.trycloudflare.com' }}
      BUILD_TYPE: ${{ github.event_name == 'push' && 'release' || github.event.inputs.build_type || 'release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-package-lock --no-audit --no-fund

      - name: TypeScript typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Generate Android native project (Expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK (${{ env.BUILD_TYPE }})
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ "${{ env.BUILD_TYPE }}" = "debug" ]; then
            ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
          else
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          fi

      - name: Verify & stage APK
        id: apk
        run: |
          if [ "${{ env.BUILD_TYPE }}" = "debug" ]; then
            APK_SRC="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            APK_OUT="ChargePilot-AI-debug.apk"
            ARTIFACT_NAME="ChargePilot-AI-debug-apk"
          else
            APK_SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
            APK_OUT="ChargePilot-AI-release.apk"
            ARTIFACT_NAME="ChargePilot-AI-release-apk"
          fi
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Không tìm thấy $APK_SRC sau khi Gradle build!"
            exit 1
          fi
          cp "$APK_SRC" "./${APK_OUT}"
          python3 -m zipfile -t "./${APK_OUT}"
          ls -lh "./${APK_OUT}"
          sha256sum "./${APK_OUT}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${APK_OUT}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.apk_file }}
          retention-days: 14

      - name: Publish GitHub Release (${{ steps.apk.outputs.tag }})
        if: env.BUILD_TYPE == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "CHARGEPILOT AI ${{ steps.apk.outputs.tag }}"
          body: |
            Bản phát hành **CHARGEPILOT AI (${{ steps.apk.outputs.tag }})**:
            - Kết nối trực tiếp Mobile App (`mobile/`) với Backend API `v1.0.0 — FROZEN` (Claude AI + 191 trạm Hà Nội + Open-Meteo 168h + Guardrails).
            - Endpoint mặc định: `${{ env.EXPO_PUBLIC_API_BASE_URL }}` (có fallback offline nếu mất mạng).
            - Tải `ChargePilot-AI-release.apk` bên dưới hoặc đẩy lên VPS qua `deploy/scripts/deploy-apk.sh`.
          files: ChargePilot-AI-release.apk

      - name: Check VPS secrets configured
        if: env.BUILD_TYPE == 'release'
        id: check_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Chưa cấu hình VPS_HOST secret — xem hướng dẫn chạy deploy-apk.sh thủ công trên VPS."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy new Release APK to VPS
        if: env.BUILD_TYPE == 'release' && steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: APK_URL,APK_VERSION,DEPLOY_DIR
          script: |
            set -euo pipefail
            APP_DIR="${DEPLOY_DIR:-/opt/greencharge}"
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose -f deploy/docker-compose.yml up -d --build api
            bash deploy/scripts/deploy-apk.sh "$APK_URL" "$APK_VERSION"
            curl -sfI http://127.0.0.1:8000/download/ChargePilot-AI.apk
        env:
          APK_URL: "https://github.com/${{ github.repository }}/releases/download/${{ steps.apk.outputs.tag }}/ChargePilot-AI-release.apk"
          APK_VERSION: ${{ steps.apk.outputs.tag }}
          DEPLOY_DIR: ${{ secrets.VPS_APP_DIR }}
